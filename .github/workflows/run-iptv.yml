name: Run IPTV Scraper

on:
  workflow_dispatch:
    inputs:
      province:
        description: '省份（34 个省级行政区单一对应）'
        required: true
        type: choice
        options:
          - 北京
          - 天津
          - 上海
          - 重庆
          - 河北
          - 山西
          - 辽宁
          - 吉林
          - 黑龙江
          - 江苏
          - 浙江
          - 安徽
          - 福建
          - 江西
          - 山东
          - 河南
          - 湖北
          - 湖南
          - 广东
          - 海南
          - 四川
          - 贵州
          - 云南
          - 陕西
          - 甘肃
          - 青海
          - 台湾
          - 内蒙古
          - 广西
          - 西藏
          - 宁夏
          - 新疆
          - 香港
          - 澳门

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      PLAYWRIGHT_HEADLESS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 缓存 Python 依赖与 playwright 浏览器，加速后续运行
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 适配 Ubuntu 22.04+ 的 Chromium 运行库
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libnss3 libatk-bridge2.0-0 libdrm-dev libxkbcommon-dev libgbm-dev libatspi2.0-0 libxshmfence-dev libasound2t64 libgtk-3-0 libx11-xcb1 libxcb-dri3-0 libxrandr2 libxcursor1 libxcomposite1 libasound2-plugins libpulse0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run Python script
        run: python -u IPTVScraper.py --province "${{ github.event.inputs.province }}"

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "update ${{ github.event.inputs.province }} live list $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
