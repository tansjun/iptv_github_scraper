# GitHub Pages 部署工作流（手动触发）
# 自动部署已并入 run-iptv.yml（抓取成功后直接部署 gh-pages，不再依赖 push 事件触发）
# 本文件保留手动触发入口，供需要时手动部署
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 部署Pages必需的权限
    steps:
      # 步骤1：拉取仓库代码（包含根目录的 .txt 文件）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 步骤2：创建临时目录，复制根目录所有 .txt 文件到该目录
      - name: Prepare deploy files
        run: |
          mkdir -p ./deploy
          cp ./*.txt ./deploy/

      # 步骤3：部署到 gh-pages 分支（Pages 默认部署分支）
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true  # 清空gh-pages分支旧内容，避免冗余文件
